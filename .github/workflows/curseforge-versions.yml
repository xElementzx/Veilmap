# Veilmap - GPL-3.0-or-later
#
# Lists CurseForge's WoW game versions, so you can find the IDs to put in the
# CF_GAME_VERSIONS repo variable used by the Release workflow. Run it from
# the Actions tab ("Run workflow"); optionally filter by name.

name: CurseForge game versions

on:
  workflow_dispatch:
    inputs:
      filter:
        description: Only show versions whose name contains this (case-insensitive)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List game versions
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FILTER: ${{ inputs.filter }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::CF_API_TOKEN is not set in the repo's Actions secrets"
            exit 1
          fi
          curl -sS -f -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/version-types -o types.json
          curl -sS -f -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions -o versions.json
          jq -r --arg f "$FILTER" --slurpfile types types.json '
            ($types[0] | map({(.id | tostring): .name}) | add) as $typeNames
            | map(select(($f == "") or (.name | ascii_downcase | contains($f | ascii_downcase))))
            | sort_by(.gameVersionTypeID, .id)
            | .[] | "\(.id)\t\($typeNames[.gameVersionTypeID | tostring] // .gameVersionTypeID)\t\(.name)"
          ' versions.json | column -t -s $'\t'
