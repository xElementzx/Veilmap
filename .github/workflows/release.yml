# Veilmap - GPL-3.0-or-later
#
# Pushing a tag like v1.2.0 tests the addon, checks the tag matches the TOC
# version, zips it and publishes a GitHub release.
#
# CurseForge is NOT uploaded from here: CurseForge's own automatic packaging
# (a repo webhook) builds and publishes the CurseForge file from the same tag,
# using .pkgmeta. Keep .pkgmeta's ignore list in step with .gitattributes'
# export-ignore so both zips have the same contents.
#
# Tags containing "-alpha" or "-beta" are marked as pre-releases.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        working-directory: tools
        run: |
          npm ci
          npm test

      - name: Check the tag matches the TOC version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          toc=$(sed -n 's/^## Version: *//p' Veilmap.toc | tr -d '\r')
          if [ "$version" != "$toc" ]; then
            echo "::error::Tag $tag does not match Veilmap.toc version $toc"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*)  type=beta ;;
            *)        type=release ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"

      # git archive honours .gitattributes export-ignore (tools, docs, media,
      # dotfiles), which is how the 1.0.0 zip was built.
      - name: Zip
        run: git archive --format=zip --prefix=Veilmap/ -o "Veilmap-${{ steps.version.outputs.version }}.zip" HEAD

      - name: Changelog
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${previous:+$previous..}${GITHUB_REF_NAME}"
          {
            echo "## Veilmap ${{ steps.version.outputs.version }}"
            echo
            git log --no-merges --format='- %s' "$range"
          } > CHANGELOG.md
          cat CHANGELOG.md

      # Re-runnable: if a later step failed, the release already exists and
      # the zip is simply replaced.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Veilmap-${{ steps.version.outputs.version }}.zip"
          prerelease=""
          if [ "${{ steps.version.outputs.type }}" != release ]; then
            prerelease="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "Veilmap ${{ steps.version.outputs.version }}" --notes-file CHANGELOG.md $prerelease
          fi
